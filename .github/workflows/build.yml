name: Build plugins
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  plugins:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Configure universal macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: RangeMasterLab-${{ matrix.os }}
          path: |
            build/RangeMasterLab_artefacts/Release/VST3/**
            build/RangeMasterLab_artefacts/Release/AU/**
            build/RangeMasterLab_artefacts/Release/Standalone/**
